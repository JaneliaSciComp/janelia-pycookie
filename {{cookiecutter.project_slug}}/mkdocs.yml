site_name: {{ cookiecutter.project_slug }}
site_description: {{ cookiecutter.project_short_description }}
site_url: https://{{ cookiecutter.github_owner }}.github.io/{{ cookiecutter.project_slug }}/
repo_url: https://github.com/{{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}
repo_name: {{ cookiecutter.github_owner }}/{{ cookiecutter.project_slug }}

nav:
  - index.md

theme:
  name: material
  features:
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_section_style: list
            docstring_style: google
            filters: ["!^_"]
            heading_level: 1
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true
  - api-autonav:
      modules: ["src/{{ cookiecutter.project_slug }}"]
